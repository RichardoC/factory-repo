name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The CodeAF workflow dispatches this on its branches, because pushes made
  # with GITHUB_TOKEN do not trigger pull_request/push workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    # The CodeAF harness in .github/codeaf is its own Go module.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/codeaf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "No go.mod yet; nothing to check."; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - name: gofmt
        if: steps.detect.outputs.go == 'true'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        if: steps.detect.outputs.go == 'true'
        run: go vet ./...
      - name: go build
        if: steps.detect.outputs.go == 'true'
        run: go build ./...
      - name: go test
        if: steps.detect.outputs.go == 'true'
        run: go test -race -count=1 ./...
