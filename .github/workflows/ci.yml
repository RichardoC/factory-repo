name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The CodeAF workflow dispatches this on its branches, because pushes made
  # with GITHUB_TOKEN do not trigger pull_request/push workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    # The CodeAF harness in .github/codeaf is its own Go module.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/codeaf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  hygiene:
    # Repository checks that need no Go module: workflow lint, and no build
    # output or other large binaries committed (AGENTS.md, repository
    # hygiene).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - name: actionlint
        # Pinned version, built from source each run. shellcheck is off for
        # now: the existing scripts have not been through it yet.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= .github/workflows/*.yml
      - name: No binaries or large files
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error file=$f::tracked file is $size bytes (over 1 MiB)"; bad=1
            fi
            if [ "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" = 7f454c46 ]; then
              echo "::error file=$f::tracked file is an ELF binary"; bad=1
            fi
          done < <(git ls-files -z)
          exit "$bad"

  modules:
    # Every Go module outside .github/ (the harness has its own job above).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          dirs=$(find . -name go.mod -not -path './.github/*' -not -path '*/vendor/*' -printf '%h\n' \
            | sed 's|^\./||; s|^\.$|.|' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Go modules: $dirs"

  go-module:
    needs: modules
    if: needs.modules.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.modules.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        # go.sum may be absent in a module with no dependencies.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -count=1 ./...

  go:
    # The required status check: passes when the harness, the repository
    # checks and every module passed (no modules yet counts as passed).
    # Kept under this name for branch protection.
    needs: [harness, hygiene, modules, go-module]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HARNESS: ${{ needs.harness.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          MODULES: ${{ needs.modules.result }}
          CHECKS: ${{ needs.go-module.result }}
        run: |
          echo "harness: $HARNESS, hygiene: $HYGIENE, modules: $MODULES, per-module checks: $CHECKS"
          [ "$HARNESS" = success ] || exit 1
          [ "$HYGIENE" = success ] || exit 1
          [ "$MODULES" = success ] || exit 1
          [ "$CHECKS" = success ] || [ "$CHECKS" = skipped ]
