name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The CodeAF workflow dispatches this on its branches, because pushes made
  # with GITHUB_TOKEN do not trigger pull_request/push workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    # The CodeAF harness in .github/codeaf is its own Go module.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/codeaf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  modules:
    # Every Go module outside .github/ (the harness has its own job above).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          dirs=$(find . -name go.mod -not -path './.github/*' -not -path '*/vendor/*' -printf '%h\n' \
            | sed 's|^\./||; s|^\.$|.|' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Go modules: $dirs"

  go-module:
    needs: modules
    if: needs.modules.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.modules.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -count=1 ./...

  go:
    # The required status check: passes when every module passed, or when
    # there are no modules yet. Kept under this name for branch protection.
    needs: [modules, go-module]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          MODULES: ${{ needs.modules.result }}
          CHECKS: ${{ needs.go-module.result }}
        run: |
          echo "modules: $MODULES, per-module checks: $CHECKS"
          [ "$MODULES" = success ] || exit 1
          [ "$CHECKS" = success ] || [ "$CHECKS" = skipped ]
