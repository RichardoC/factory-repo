# The queue: starts the next CodeAF run on its own, so the factory keeps going
# without a person labelling issues one at a time.
#
# Every 10 minutes (and on demand, via workflow_dispatch) it builds the harness
# from the default branch and asks it (`harness next`) to pick one issue from
# the open issues and the recent CodeAF runs:
#   * issues labelled `codeaf-queued` are the backlog, oldest first unless they
#     carry the `codeaf-priority` label;
#   * an issue may start a run only when no CodeAF run is queued or in
#     progress, every issue named in a "Depends on #N" line in its body is
#     closed, and the day's spend in the shared state is under the threshold
#     (75% of limits.day_usd in .github/codeaf/models.json).
# It marks the chosen issue with the `codeaf` label — the same trust gate a
# person uses (codeaf.yml's gate refuses any run whose issue lacks it) — and
# then dispatches codeaf.yml. The dispatch step exists because events raised
# with GITHUB_TOKEN (adding a label among them) do not trigger other workflows;
# workflow_dispatch is the one event GITHUB_TOKEN can start.
#
# Security posture (AGENTS.md, "Security rules"): the only credential is
# github.token. `issues: write` is needed only for the two labels, `actions:
# write` only for the dispatch. The harness is built from the default branch,
# never from a PR, and `state load` checks the shared-state bundle before its
# spend figure is used. Every step fails closed: if the spend is unknown or no
# issue qualifies, nothing is labelled and nothing starts.
name: CodeAF queue

on:
  # GitHub runs schedules late or not at all when busy, so the queue also
  # ticks when a CodeAF run finishes and when someone queues an issue. The
  # schedule is the fallback.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [CodeAF]
    types: [completed]
  issues:
    types: [labeled]

# Two queue ticks never overlap: the second waits for the first to finish.
concurrency:
  group: codeaf-queue
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # add `codeaf`, remove `codeaf-queued`
  actions: write # dispatch codeaf.yml

env:
  CODEAF_LABEL: codeaf
  CODEAF_QUEUED_LABEL: codeaf-queued

jobs:
  queue:
    # Most issue label events are other labels; only codeaf-queued matters.
    if: github.event_name != 'issues' || github.event.label.name == 'codeaf-queued'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Paths
        run: |
          {
            # Same paths as in codeaf.yml and codeaf-state.yml, or the state
            # cache never matches.
            echo "SHARED_DIR=$RUNNER_TEMP/codeaf-shared"
            echo "CODEAF_HOME=$RUNNER_TEMP/codeaf-home"
            echo "HARNESS=$RUNNER_TEMP/harness/harness"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch: this job holds a token with write
          # scopes, so it must never build or run PR code.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/codeaf
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - name: Build the harness
        # Exactly as in the publish job: from the default branch's checkout,
        # never from a PR or anything an earlier job produced.
        run: |
          cp -r .github/codeaf "$RUNNER_TEMP/harness"
          (cd "$RUNNER_TEMP/harness" && go build -trimpath -o harness .)

      # The day's spend in the shared state decides whether another run fits
      # in the budget. Restore only: this job never saves the cache —
      # codeaf-state.yml is its only writer, one merge at a time.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHARED_DIR }}
          key: codeaf-shared-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codeaf-shared-v1-
      - name: Load the shared state
        id: shared
        # `state load` checks the untrusted bundle before use (AGENTS.md,
        # "Caches and carried state") and fails here if it is not valid.
        run: |
          mkdir -p "$CODEAF_HOME"
          "$HARNESS" state load "$SHARED_DIR" "$CODEAF_HOME"

      - name: Read the open issues and the recent CodeAF runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > issues.json
          gh run list --workflow=codeaf.yml --json status --limit 100 > runs.json

      - name: Pick the next queued issue
        id: next
        # A non-zero exit fails the job: fail closed, no label on unknown
        # spend.
        env:
          CODEAF_DAY_SPENT_USD: ${{ steps.shared.outputs.day_usd }}
        run: |
          n=$("$HARNESS" next issues.json runs.json)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "next issue: ${n:-none}"

      - name: Label the issue and start the run
        if: steps.next.outputs.n != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled events carry no repository payload; they run on the
          # default branch, so its name is the run's own ref.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          N: ${{ steps.next.outputs.n }}
        run: |
          gh issue edit "$N" --add-label "$CODEAF_LABEL"
          # Best effort: once the run has started, `codeaf-queued` has said
          # all it can; a failure here only leaves a stale label.
          gh issue edit "$N" --remove-label "$CODEAF_QUEUED_LABEL" || true
          # GITHUB_TOKEN's events do not trigger workflows, so the label alone
          # would not start codeaf.yml. workflow_dispatch is the one event
          # GITHUB_TOKEN can start, so the queue dispatches it itself.
          gh workflow run codeaf.yml --ref "$DEFAULT_BRANCH" -f "issue=$N"
