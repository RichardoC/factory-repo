# The queue: starts the next CodeAF run on its own, so the factory keeps going
# without a person labelling issues one at a time.
#
# Every 10 minutes (and on demand, via workflow_dispatch) it builds the harness
# from the default branch and asks it (`harness next`) to pick one issue from
# the open issues and the recent CodeAF runs:
#   * issues labelled `codeaf-queued` are the backlog, oldest first unless they
#     carry the `codeaf-priority` label;
#   * an issue may start a run only while fewer than queue.max_parallel_runs
#     (models.json, default 2) codeaf.yml runs are queued or in progress —
#     issue runs, PR continuations and review runs alike — with no area
#     conflict with an in-flight run (areas are app/<name>/ and the harness
#     .github/, from area: labels or body paths; no area conflicts with
#     everything), every issue named in a "Depends on #N" line in its body
#     closed, and the rolling week's credit spend in the shared state under
#     the threshold (75% of limits.weekly_credit_usd in
#     .github/codeaf/models.json). The queue assigns each run a lane so
#     concurrent runs sit on different seat models.
# It marks the chosen issue with the `codeaf` label — the same trust gate a
# person uses (codeaf.yml's gate refuses any run whose issue lacks it) — and
# then dispatches codeaf.yml. The dispatch step exists because events raised
# with GITHUB_TOKEN (adding a label among them) do not trigger other workflows;
# workflow_dispatch is the one event GITHUB_TOKEN can start.
#
# Security posture (AGENTS.md, "Security rules"): the only credential is
# github.token. `issues: write` is needed only for the two labels, `actions:
# write` only for the dispatch. The harness is built from the default branch,
# never from a PR, and `state load` checks the shared-state bundle before its
# spend figure is used. Every step fails closed: if the spend is unknown or no
# issue qualifies, nothing is labelled and nothing starts.
name: CodeAF queue

on:
  # GitHub runs schedules late or not at all when busy, so the queue also
  # ticks when a CodeAF run finishes and when someone queues an issue. The
  # schedule is the fallback.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      finished_run:
        description: a CodeAF run that is finishing and must not count as in progress
        required: false
        type: string
  workflow_run:
    workflows: [CodeAF]
    types: [completed]
  issues:
    types: [labeled]

# Two queue ticks never overlap: the second waits for the first to finish.
concurrency:
  group: codeaf-queue
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # add `codeaf`, remove `codeaf-queued`
  actions: write # dispatch codeaf.yml
  # Read: the issues endpoint lists pull requests only to a token that can
  # read them, and the queue picks PRs labelled codeaf-review-needed /
  # codeaf-continue-needed (issue #137) and reads their changed files (issue
  # #132). Write: it removes those labels once the run is dispatched. Without
  # this the PRs were silently missing from issues.json and no review ever
  # started (PR #174). This job runs no agent.
  pull-requests: write

env:
  CODEAF_LABEL: codeaf
  CODEAF_QUEUED_LABEL: codeaf-queued
  # The labels publish adds to a PR to have the queue start its review and
  # continuation runs (issue #137). Kept identical to the harness's
  # labelReviewNeeded / labelContinueNeeded consts.
  CODEAF_REVIEW_NEEDED_LABEL: codeaf-review-needed
  CODEAF_CONTINUE_NEEDED_LABEL: codeaf-continue-needed

jobs:
  queue:
    # Most issue label events are other labels; only codeaf-queued matters.
    if: github.event_name != 'issues' || github.event.label.name == 'codeaf-queued'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Paths
        run: |
          {
            # Same paths as in codeaf.yml and codeaf-state.yml, or the state
            # cache never matches.
            echo "SHARED_DIR=$RUNNER_TEMP/codeaf-shared"
            echo "CODEAF_HOME=$RUNNER_TEMP/codeaf-home"
            echo "HARNESS=$RUNNER_TEMP/harness/harness"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch: this job holds a token with write
          # scopes, so it must never build or run PR code.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/codeaf
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - name: Build the harness
        # Exactly as in the publish job: from the default branch's checkout,
        # never from a PR or anything an earlier job produced.
        run: |
          cp -r .github/codeaf "$RUNNER_TEMP/harness"
          (cd "$RUNNER_TEMP/harness" && go build -trimpath -o harness .)

      # The day's spend in the shared state decides whether another run fits
      # in the budget. Restore only: this job never saves the cache —
      # codeaf-state.yml is its only writer, one merge at a time.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHARED_DIR }}
          key: codeaf-shared-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codeaf-shared-v1-
      - name: Load the shared state
        id: shared
        # `state load` checks the untrusted bundle before use (AGENTS.md,
        # "Caches and carried state") and fails here if it is not valid.
        run: |
          mkdir -p "$CODEAF_HOME"
          "$HARNESS" state load "$SHARED_DIR" "$CODEAF_HOME"

      - name: Read the open issues and the recent CodeAF runs
        env:
          GH_TOKEN: ${{ github.token }}
          FINISHED_RUN: ${{ inputs.finished_run }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > issues.json
          # A CodeAF run that dispatched this tick as its last job is still in
          # progress; leave it out. Digits only, or nothing is left out.
          [[ "$FINISHED_RUN" =~ ^[0-9]{1,20}$ ]] || FINISHED_RUN=""
          # createdAt comes along for the planner (issue #61): plan-check
          # measures its cooldown against every plan-title run's stamp.
          gh run list --workflow=codeaf.yml --json databaseId,status,displayTitle,createdAt --limit 100 \
            | jq --arg id "$FINISHED_RUN" '[.[] | select((.databaseId | tostring) != $id)]' > runs.json
          # The newest completed plan run's outcome marker (issue #119): the
          # publish job of a plan run uploads codeaf-plan-outcome with the
          # number of proposals it opened. plan-check cools down
          # planner.retry_min_hours instead of planner.min_hours after a plan
          # run that opened nothing. The marker is untrusted data, validated
          # by plan-check before use; a missing or unreadable one reads as an
          # unknown outcome there, which keeps the full cooldown (fail
          # closed). Only the newest completed plan run is fetched: an older
          # one inside the cooldown then counts as unknown, never as
          # retry-soon.
          rid=$(jq -r '[.[] | select(.status == "completed" and (.displayTitle | startswith("CodeAF plan")))][0].databaseId // empty' runs.json)
          rm -rf "$RUNNER_TEMP/plan-outcome"
          if [ -n "$rid" ] && [[ "$rid" =~ ^[0-9]{1,20}$ ]] \
             && gh run download "$rid" -n codeaf-plan-outcome -D "$RUNNER_TEMP/plan-outcome" 2>/dev/null; then
            echo "plan-outcome marker downloaded from plan run $rid"
          else
            echo "no plan-outcome marker for run ${rid:-none}; plan-check will use the full cooldown"
          fi

      - name: Start queued issues while there are free slots
        # One tick fills every free slot: ticks come only when a run ends or
        # an issue is queued (GitHub runs the schedule late or not at all), so
        # starting one run per tick would rarely let runs overlap. After each
        # start, the picked issue is relabelled in issues.json and the new run joins
        # runs.json under the title codeaf.yml will give it, so the next pick
        # sees its area and lane. harness next enforces max_parallel_runs, the
        # area rules and the spend threshold on every pick; the loop's own
        # bound is only a backstop. A non-zero exit fails the job: fail
        # closed, no label on unknown spend.
        env:
          GH_TOKEN: ${{ github.token }}
          CODEAF_WEEK_SPENT_USD: ${{ steps.shared.outputs.week_usd }}
          # Scheduled events carry no repository payload; they run on the
          # default branch, so its name is the run's own ref.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          for _ in 1 2 3 4 5; do
            # harness next prints GITHUB_OUTPUT-style lines (kind=, number=,
            # lane=) on stdout, nothing while it holds the pick; its human log
            # goes to stderr. Parsed, never sourced: a known kind, digits
            # only, or stop (issue #137).
            out=$("$HARNESS" next issues.json runs.json)
            KIND=$(sed -n 's/^kind=//p' <<<"$out" | head -1)
            N=$(sed -n 's/^number=//p' <<<"$out" | head -1)
            LANE=$(sed -n 's/^lane=//p' <<<"$out" | head -1)
            case "$KIND" in issue|review|continue) ;; *) break ;; esac
            [[ "$N" =~ ^[0-9]{1,10}$ ]] || break
            [[ "$LANE" =~ ^[0-9]{1,4}$ ]] || LANE=0
            # GITHUB_TOKEN's events do not trigger workflows, so the label
            # alone would not start codeaf.yml: workflow_dispatch is the one
            # event GITHUB_TOKEN can start, so the queue dispatches it itself.
            # Each kind gets the input the gate reads for it, with its lane;
            # the title codeaf.yml will give it is mirrored into runs.json so
            # the next pick sees its lane and (for a continuation) its areas.
            case "$KIND" in
              review)
                echo "starting review #$N on lane $LANE"
                gh workflow run codeaf.yml --ref "$DEFAULT_BRANCH" -f "review=$N" -f "lane=$LANE"
                # The label has done its work; a failure only leaves it stale.
                gh pr edit "$N" --remove-label "$CODEAF_REVIEW_NEEDED_LABEL" || true
                TITLE="CodeAF review #$N (lane $LANE)"
                ;;
              continue)
                echo "starting continuation #$N on lane $LANE"
                gh workflow run codeaf.yml --ref "$DEFAULT_BRANCH" -f "pr=$N" -f "lane=$LANE"
                gh pr edit "$N" --remove-label "$CODEAF_CONTINUE_NEEDED_LABEL" || true
                TITLE="CodeAF #$N (lane $LANE)"
                ;;
              *)
                echo "starting #$N on lane $LANE"
                gh issue edit "$N" --add-label "$CODEAF_LABEL"
                # Best effort: once the run has started, `codeaf-queued` has
                # said all it can; a failure here only leaves a stale label.
                gh issue edit "$N" --remove-label "$CODEAF_QUEUED_LABEL" || true
                gh workflow run codeaf.yml --ref "$DEFAULT_BRANCH" -f "issue=$N" -f "lane=$LANE"
                # Mirror the relabel: the issue stays (the in-flight run's area
                # is read from it) but is no longer a candidate.
                jq --argjson n "$N" --arg q "$CODEAF_QUEUED_LABEL" --arg c "$CODEAF_LABEL" \
                  'map(if .number == $n then .labels = ([.labels[] | select(.name != $q)] + [{"name": $c}]) else . end)' \
                  issues.json > issues.next && mv issues.next issues.json
                TITLE="CodeAF #$N (lane $LANE)"
                ;;
            esac
            jq --arg t "$TITLE" '. + [{"databaseId": 0, "status": "queued", "displayTitle": $t}]' runs.json > runs.next && mv runs.next runs.json
          done

      - name: Dispatch the planner when the backlog runs low
        # Issue #61: with the slots filled by the loop above (or none taken),
        # plan-check decides whether the backlog needs a plan run: fewer than
        # planner.min_backlog (models.json) queued issues open and no plan run
        # started within its cooldown -- planner.min_hours, or the shorter
        # planner.retry_min_hours after a plan run known to have opened no
        # proposals (issue #119, PLAN_OUTCOMES_PATH below) -- under the same
        # spend threshold and lane capacity as any other run. The plan run is
        # read-only -- it writes no patch and opens no PR; its proposals land
        # as issues labelled codeaf-proposed, promoted to codeaf-queued by a
        # person.
        env:
          GH_TOKEN: ${{ github.token }}
          # The plan-outcome marker downloaded above, if the newest completed
          # plan run left one; validated by plan-check before use (issue
          # #119). Unset or missing means an unknown outcome, which keeps the
          # full planner.min_hours cooldown.
          PLAN_OUTCOMES_PATH: ${{ runner.temp }}/plan-outcome/plan-outcome.json
          CODEAF_WEEK_SPENT_USD: ${{ steps.shared.outputs.week_usd }}
          # Scheduled events carry no repository payload; they run on the
          # default branch, so its name is the run's own ref.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          # Parsed, never sourced: plan-check prints plan=1 and lane=<digits>
          # on stdout only when a plan run should start; anything else (an
          # empty stdout, a non-digit lane) means do nothing.
          out=$("$HARNESS" plan-check issues.json runs.json)
          PLAN=$(sed -n 's/^plan=//p' <<<"$out" | head -1)
          LANE=$(sed -n 's/^lane=//p' <<<"$out" | head -1)
          [ "$PLAN" = 1 ] || exit 0
          [[ "$LANE" =~ ^[0-9]{1,4}$ ]] || LANE=0
          echo "dispatching a plan run on lane $LANE"
          gh workflow run codeaf.yml --ref "$DEFAULT_BRANCH" -f plan=true -f "lane=$LANE"
          # Mirror the in-flight run into runs.json the way the loop does, so
          # a later tick sees the lane taken and the plan cooldown running.
          jq --arg t "CodeAF plan (lane $LANE)" \
            '. + [{"databaseId": 0, "status": "queued", "displayTitle": $t, "createdAt": (now | todate)}]' \
            runs.json > runs.next && mv runs.next runs.json
