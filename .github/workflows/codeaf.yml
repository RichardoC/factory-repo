# CodeAF (https://github.com/Agent-Field/CodeAF) running entirely inside GitHub Actions.
#
# Triggers, all gated on the `codeaf` label (adding a label needs triage access):
#   * an issue gets the `codeaf` label     -> CodeAF works the issue on a fresh
#     branch `codeaf/issue-N-<run id>` cut from the default branch and opens its
#     own PR, so an issue can be re-run without colliding with an earlier run
#   * `/codeaf <text>` comment on a labelled issue or PR, or a "changes requested"
#     review on a labelled PR, from an OWNER/MEMBER/COLLABORATOR
#                                            -> CodeAF continues on that PR's branch
#
# Models come from synthetic.new through `harness proxy` (.github/codeaf/main.go), which serves
# CodeAF a catalog with synthetic.new's real prices, adds usage.cost to every
# response, refuses models outside .github/codeaf/models.json and enforces the
# per-run and per-day spend caps set in that file.
#
# Jobs, split by privilege (AGENTS.md, "Security rules"):
#   gate     decides whether this event may run at all (read-only)
#   run      runs CodeAF. The agent has a shell here, so this job holds no write
#            token; it hands over a patch, CodeAF's state and diagnostics.
#   handoff  asks the CodeAF state workflow (codeaf-state.yml) to merge this
#            run's state into the bundle shared by all runs
#   publish  a fresh runner with write access. It treats everything from `run`
#            as untrusted data: it checks and applies the patch, then commits,
#            pushes, opens the PR and posts the report.
name: CodeAF
# Countable by title: the queue parses run titles to learn which lane each
# in-flight run sits on; a title that does not parse counts as lane 0.
run-name: "CodeAF #${{ inputs.issue || github.event.issue.number || github.event.pull_request.number || inputs.pr || inputs.review }}${{ inputs.lane && format(' (lane {0})', inputs.lane) || '' }}"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: issue number the queue labelled codeaf
        required: false
        type: string
      pr:
        description: PR number a finished run wants continued
        required: false
        type: string
      review:
        description: PR number a finished run wants independently reviewed
        required: false
        type: string
      lane:
        description: lane number the queue assigned, digits only
        required: false
        type: string

permissions:
  contents: read

env:
  CODEAF_LABEL: codeaf

jobs:
  gate:
    # Cheap pre-filter so unrelated comments don't even start a runner job.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'codeaf') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/codeaf')) ||
      (github.event_name == 'pull_request_review' && (github.event.review.state == 'changes_requested' || startsWith(github.event.review.body, '/codeaf'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
      number: ${{ steps.gate.outputs.number }}
      branch: ${{ steps.gate.outputs.branch }}
      base: ${{ steps.gate.outputs.base }}
      lane: ${{ steps.gate.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch. On pull_request_review events the
          # default ref is the PR's merge commit, i.e. PR code.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/codeaf
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd .github/codeaf && go run . gate

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # One group per issue or PR, not one for all runs: GitHub keeps only the
      # newest pending run in a group and cancels the others, so a global group
      # would silently drop a /codeaf comment made while another run is going.
      # The queue (codeaf-queue.yml) keeps queued work from overlapping.
      group: codeaf-run-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    # No write access of any kind: the agent can read anything this job can.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      week_before: ${{ steps.shared.outputs.week_usd }}
      # Only routes publish to the approval-gated environment. publish checks
      # the patch itself and never trusts this to mean "no .github/ changes".
      touches_harness: ${{ steps.package.outputs.touches_harness }}
      # The attempt that uploaded codeaf-output-*. Re-running only a failed
      # publish starts a new attempt, but its patch is still this one's.
      attempt: ${{ github.run_attempt }}
    env:
      MODE: ${{ needs.gate.outputs.mode }}
      NUMBER: ${{ needs.gate.outputs.number }}
      LANE: ${{ needs.gate.outputs.lane }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      # Issue #57: the branch a pr run brings in — the PR base branch.
      BASE: ${{ needs.gate.outputs.base }}
      # The time budget the brief states, and the same limit `codeaf do` gets:
      # one literal value, passed as data, never through an expression.
      CODEAF_BUDGET_MINUTES: "100"
    steps:
      - name: Paths
        run: |
          {
            echo "BRIEF_PATH=$RUNNER_TEMP/brief.md"
            echo "RESULT_PATH=$RUNNER_TEMP/out/codeaf-result.json"
            echo "LEDGER_PATH=$RUNNER_TEMP/out/codeaf-ledger.jsonl"
            # Same path as in codeaf-state.yml, or the cache never matches.
            echo "SHARED_DIR=$RUNNER_TEMP/codeaf-shared"
            echo "CODEAF_HOME=$RUNNER_TEMP/codeaf-home"
            echo "HARNESS=$RUNNER_TEMP/harness/harness"
            echo "TOOLS=$RUNNER_TEMP/tools"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch, so the harness (including the proxy that
          # receives the API key) is built from reviewed code, never from a PR.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Build the harness
        # Built from the default branch before the working branch is checked
        # out, and before CodeAF starts. The agent could still swap the binary
        # (same user), which is why nothing after CodeAF in this job holds a
        # secret or a write token.
        run: |
          cp -r .github/codeaf "$RUNNER_TEMP/harness"
          (cd "$RUNNER_TEMP/harness" && go build -trimpath -o harness .)

      - name: Check out the working branch
        run: |
          # Continue an existing CodeAF branch if there is one, else branch
          # from the default branch checked out above.
          if git fetch --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null; then
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          git rev-parse HEAD > "$RUNNER_TEMP/out/base-commit"

      - name: Merge the PR base branch
        # Issue #57: a PR that conflicts with its base stays dirty forever
        # unless its branch comes to contain the base. Before CodeAF works,
        # the base tip is merged into the branch: cleanly when the trees
        # merge, otherwise as a merge commit whose files carry conflict
        # markers, which the brief names for CodeAF to resolve. The commit
        # exists only in this checkout — the run job has no write token and
        # pushes nothing — and publish recreates it from the same two
        # parents, checked by tree hash, before applying the patch
        # (merge.go).
        if: needs.gate.outputs.mode == 'pr'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$HARNESS" merge-default run "$RUNNER_TEMP/out/base-commit" "$RUNNER_TEMP/out/merge-info.json"

      - name: Build CodeAF
        # Always from the pinned source, never from a cache: a cached binary was
        # written by an earlier job the agent ran in. The pin lives in
        # .github/codeaf/codeaf-ref, so a bump is a config change under
        # .github/codeaf/ that publishes like app code — not a workflow edit
        # that would need maintainer approval every time.
        run: |
          # The run job checked out the default branch fully, so the pin file is
          # here. Read it with plain shell and validate it before any other use;
          # it is never written to GITHUB_ENV or GITHUB_OUTPUT.
          CODEAF_REF=$(tr -d "[:space:]" 2>/dev/null < .github/codeaf/codeaf-ref || true)
          if ! [[ "$CODEAF_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/codeaf/codeaf-ref is missing or is not exactly 40 lowercase hex characters (a full commit SHA); fix the pin file"
            exit 1
          fi
          git clone --filter=blob:none https://github.com/Agent-Field/codeaf "$RUNNER_TEMP/codeaf-src"
          git -C "$RUNNER_TEMP/codeaf-src" checkout --detach "$CODEAF_REF"
          (cd "$RUNNER_TEMP/codeaf-src" && CGO_ENABLED=0 go build -trimpath -o "$TOOLS/codeaf" ./cmd/codeaf)

      # The state shared by all runs (.github/codeaf/state.go): CodeAF's memory
      # db, its router events and model ratings, and the day's spend. Only the
      # CodeAF state workflow (codeaf-state.yml) writes it, from runs' packed
      # state, which it checks; `state load` checks it again before CodeAF
      # starts, and fails the run if it is not a valid bundle.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHARED_DIR }}
          key: codeaf-shared-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codeaf-shared-v1-
      - name: Load the shared state
        id: shared
        run: |
          mkdir -p "$CODEAF_HOME"
          "$HARNESS" state load "$SHARED_DIR" "$CODEAF_HOME"

      - name: Start pricing proxy
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          PROXY_WEEK_SPENT_USD: ${{ steps.shared.outputs.week_usd }}
          PROXY_LEDGER: ${{ env.LEDGER_PATH }}
        run: |
          # The key goes in on stdin so it is not in the proxy's environment,
          # where the CodeAF job (same user) could read it.
          key="$SYNTHETIC_API_KEY"; unset SYNTHETIC_API_KEY
          printf '%s\n' "$key" | nohup "$HARNESS" proxy > "$RUNNER_TEMP/proxy.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8787/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/proxy.log"; exit 1

      - name: Write the brief
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Issue #57: set when the step above merged the PR base branch in
          # (naming the conflicts on a conflict), so the brief tells the run.
          MERGE_INFO_FILE: ${{ runner.temp }}/out/merge-info.json
        run: |
          # A review run's brief asks for a review of the PR's diff against
          # the issue instead of working the issue.
          if [ "$MODE" = review ]; then
            "$HARNESS" review-brief
          else
            "$HARNESS" brief
          fi

      - name: Create the agent user
        # From issue #54: the agent no longer runs as the runner user -- which
        # has passwordless sudo on these runners and could reach the runner's
        # own processes (run 39021136064 died when its broad kill hit
        # Runner.Worker). It gets a fresh, unprivileged user: no sudo, no
        # groups that carry privileges (not `docker` either -- its socket is a
        # root equivalent here). Runners are ephemeral, so nothing to clean up.
        run: |
          sudo -n useradd --create-home --shell /bin/bash codeaf
          # The image ships /home/runner as 0750, which would leave the agent
          # user unable to traverse into the workspace or $RUNNER_TEMP at all.
          # This adds the traverse bit only: --x for others, no read, no
          # listing -- every file inside keeps its own mode.
          sudo -n chmod o+x /home/runner

      - name: Prove the agent user cannot reach the runner
        # The property the run now relies on, asserted before CodeAF starts.
        # As the agent user: kill -0 on the runner's own worker (the process
        # whose SIGTERM ended run 39021136064 as a silent cancel) must fail,
        # its /proc environment must be unreadable, and sudo must refuse.
        # If any probe succeeds, agent and runner share a user again, and the
        # run stops here -- before the agent exists, never after.
        run: |
          worker=$(pgrep -u "$(id -u)" -f 'Runner\.Worker' | head -1)
          if ! [[ "$worker" =~ ^[0-9]+$ ]]; then
            echo "::error::could not find the Runner.Worker process; cannot verify the agent sandbox"
            exit 1
          fi
          if sudo -n -u codeaf bash -c "kill -0 $worker" >/dev/null 2>&1; then
            echo "::error::the agent user can signal the runner's worker (pid $worker); the sandbox is not in effect"
            exit 1
          fi
          if sudo -n -u codeaf head -c 1 "/proc/$worker/environ" >/dev/null 2>&1; then
            echo "::error::the agent user can read the runner's process environment (pid $worker); the sandbox is not in effect"
            exit 1
          fi
          if sudo -n -u codeaf sudo -n true >/dev/null 2>&1; then
            echo "::error::the agent user has sudo; the sandbox is not in effect"
            exit 1
          fi
          echo "agent sandbox ok: no signal, no /proc/$worker/environ, no sudo for the agent user"

      - name: Put the harness on the agent PATH
        # Issue #58: the brief tells CodeAF to run `harness search` for
        # documentation, API and error-message lookups. The binary is built
        # from the default branch above, before the agent exists, and is
        # installed root-owned: the agent can call it but not replace it,
        # and /usr/local/bin is on the PATH the Run CodeAF step passes it.
        run: |
          sudo -n install -m 0755 -o root -g root "$HARNESS" /usr/local/bin/harness

      - name: Run CodeAF
        # CodeAF's settings (budgets, telemetry off) are in
        # .github/codeaf/codeaf-config.json; the harness prints them as the
        # profile config, with the seat models from models.json that the
        # run's lane selects. Only the endpoint stays in the environment:
        # CodeAF reads it from nowhere else.
        #
        # CODEAF_MODELS (the escalation panel, .github/codeaf/panel.json) is
        # deliberately not set. With a panel, CodeAF's router checks every reply
        # with verify(), which counts a reply holding only tool calls as
        # "empty_response". Nearly every agent step is such a reply, so runs
        # ended at once with "the request did not get through". The pinned
        # router also sent every rung to the seat model, so it never escalated.
        # Put it back once CodeAF fixes both (internal/router/router.go).
        env:
          CODEAF_BASE_URL: http://127.0.0.1:8787/v1
        run: |
          # In review mode the harness prints the reviewer seat's config (its
          # model differs from the worker's, so the review does not share the
          # patch author's blind spots); review-config is unchanged. For other
          # modes the seat models come from models.json, chosen by the
          # gate-validated lane and validated again inside seat-config (a bad
          # lane means lane 0) — never from the issue.
          if [ "$MODE" = review ]; then
            "$HARNESS" review-config > "$CODEAF_HOME/config.json"
          else
            "$HARNESS" seat-config "$LANE" > "$CODEAF_HOME/config.json"
          fi
          # The working tree and CodeAF's home are handed to the agent user
          # for the run: it needs write access to both and to nothing else.
          # config.json above was written first, by the runner user. "Take the
          # tree back", the step after this one, returns both afterwards.
          sudo -n chown -R codeaf:codeaf "$GITHUB_WORKSPACE" "$CODEAF_HOME"
          set +e
          # CodeAF runs as the agent user (-u codeaf), with its own home (-H)
          # and in its own session (setsid: a new session, detached from this
          # shell's, so it can neither signal this shell nor the runner behind
          # it; -w makes setsid wait and return CodeAF's exit code). Only the
          # environment it needs is passed -- the proxy endpoint, its home,
          # and PATH for the tool shells its agent uses; sudo's env_reset
          # drops everything else, so nothing secret reaches the agent's
          # environment. The proxy keeps running as the runner user on
          # 127.0.0.1, where the agent user can connect but can neither kill
          # nor replace it. stdout and stderr are redirected by this
          # runner-user shell, so the result file is written by the runner.
          # shellcheck disable=SC2024  # the redirects are this shell's on purpose: the runner user, not the agent, writes the result and the stderr log
          sudo -n -u codeaf -H env \
            CODEAF_BASE_URL="$CODEAF_BASE_URL" \
            CODEAF_HOME="$CODEAF_HOME" \
            PATH="$PATH" \
            setsid -w "$TOOLS/codeaf" "do" "$(cat "$BRIEF_PATH")" --dir . --json --yes-spend --timeout "${CODEAF_BUDGET_MINUTES:-100}m" \
            > "$RESULT_PATH" 2> "$RUNNER_TEMP/codeaf.stderr"
          echo "codeaf exit code: $?"
          tail -n 80 "$RUNNER_TEMP/codeaf.stderr"
          "$HARNESS" summary
          exit 0

      - name: Take the tree back
        # Runs even on failure and cancellation, like the packaging steps
        # below: the patch, the state pack and the diagnostics all read the
        # tree and CodeAF's home as the runner user. What the agent wrote
        # stays; only the ownership changes back -- it is untrusted data
        # either way (AGENTS.md, "Caches and carried state").
        if: always()
        run: sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$CODEAF_HOME"

      # From here on, this job only packages results. Nothing it produces is
      # trusted by `publish`.
      - name: Package the changes as a patch
        id: package
        # Not on cancel: partial work from a cancelled run is never handed on.
        # (Its state below is still packed, so a cancelled run's cost counts.)
        # Never in review mode: a reviewer must not hand publish a patch — a
        # stray file write by the reviewer would route publish into the
        # approval-gated environment for a patch that is never applied.
        if: ${{ !cancelled() && needs.gate.outputs.mode != 'review' }}
        run: |
          # Changes under .github/ are included. Those outside .github/codeaf/
          # (workflows, CODEOWNERS) are applied only after a maintainer
          # approves (the codeaf-harness environment). .github/codeaf/ is the
          # harness program and its config. Every job holding a secret or a
          # write token builds it from the default branch only, so a change
          # there takes effect only once it is merged; until then CI just
          # tests it, read-only and without secrets, like app code.
          git -c core.hooksPath=/dev/null add -A -- .
          git -c core.hooksPath=/dev/null diff --cached --binary --no-ext-diff --no-textconv HEAD \
            > "$RUNNER_TEMP/out/changes.patch"
          echo "Patch: $(wc -c < "$RUNNER_TEMP/out/changes.patch") bytes"
          outside=$(git -c core.hooksPath=/dev/null diff --cached --no-renames --name-only HEAD | grep '^\.github/' | grep -v '^\.github/codeaf/' || true)
          if [ -n "$outside" ]; then
            echo "touches_harness=true" >> "$GITHUB_OUTPUT"
            echo "::notice::the patch changes .github/ outside .github/codeaf/; publishing waits for a maintainer's approval"
          fi

      - name: Pack CodeAF's state
        # What CodeAF left in its home and what the run cost (the proxy's
        # in-memory total), for the CodeAF state workflow to merge into the
        # shared bundle, which checks it all again first.
        if: always()
        env:
          BASE_GENERATION: ${{ steps.shared.outputs.generation }}
        run: '"$HARNESS" state pack "$CODEAF_HOME" "$RUNNER_TEMP/state-out"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeaf-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-out
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect diagnostics
        # Not encrypted, so anyone can see why a run went the way it did: the
        # brief, CodeAF's stderr, its run records (prompts, model replies,
        # tool output), its call log and usage, and the proxy log. This is a
        # public repository, so any signed-in GitHub user can download them.
        # No secret is in this job's environment once the proxy has started,
        # and token-shaped strings are redacted as a backstop. Only regular
        # files are copied, so a planted symlink can't pull other files in.
        if: always()
        run: |
          bundle="$RUNNER_TEMP/diagnostics"
          rm -rf "$bundle" && mkdir -p "$bundle"
          for f in "$BRIEF_PATH" "$RUNNER_TEMP/codeaf.stderr" "$RUNNER_TEMP/proxy.log"; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "$bundle/"; fi
          done
          if [ -d "$CODEAF_HOME" ]; then
            (cd "$CODEAF_HOME" && find runs logs v3/usage.jsonl router-events.jsonl router-ledger.json \
              -type f -size -100M -print0 2>/dev/null | xargs -0 -r cp --parents -t "$bundle/") || true
          fi
          tokens='(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          grep -rlZE "$tokens" "$bundle" | xargs -0 -r sed -i -E "s/$tokens/[redacted]/g"
          du -sh "$bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeaf-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The patch, its base commit, CodeAF's result and the cost ledger: all of
        # it is published on the PR anyway. `publish` reads it as untrusted data.
        if: ${{ !cancelled() }}
        with:
          name: codeaf-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 14

  handoff:
    # Starts the state merge as soon as the run job is done. Waiting for the
    # whole run to complete would hold it until publish ends, which can wait
    # hours for an approval, and until the merge no run sees this run's spend.
    needs: run
    if: ${{ always() && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run codeaf-state.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  publish:
    needs: [gate, run]
    # !cancelled(), not always(): a cancelled run must not publish its
    # partial work. (A failed run still reports.)
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # A patch that changes .github/ (the harness, CI, workflows) runs this job
    # in the codeaf-harness environment, which needs a maintainer's approval
    # before the job starts. Pushing it would otherwise let a prompt-injected
    # run put its own workflows on a branch, where CI would run them with
    # secrets. "Check the maintainer's approval" below verifies the approval
    # through the API, so an environment without reviewers can't skip it.
    environment: ${{ needs.run.outputs.touches_harness == 'true' && 'codeaf-harness' || '' }}
    timeout-minutes: 15
    concurrency:
      group: codeaf-publish-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # dispatch CI on the pushed branch (pushes by GITHUB_TOKEN don't trigger workflows)
    env:
      MODE: ${{ needs.gate.outputs.mode }}
      NUMBER: ${{ needs.gate.outputs.number }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      BASE: ${{ needs.gate.outputs.base }}
      RUN_RESULT: ${{ needs.run.result }}
    steps:
      - name: Paths
        run: |
          {
            echo "IN=$RUNNER_TEMP/in"
            echo "RESULT_PATH=$RUNNER_TEMP/in/codeaf-result.json"
            echo "LEDGER_PATH=$RUNNER_TEMP/in/codeaf-ledger.jsonl"
            # The report reads the patch and the publish steps' ::error::
            # lines as data: capped and escaped, never executed.
            echo "PATCH_PATH=$RUNNER_TEMP/in/changes.patch"
            echo "PUBLISH_ERRORS_PATH=$RUNNER_TEMP/publish-errors.log"
            echo "HARNESS=$RUNNER_TEMP/harness/harness"
            # Where pr-mode writes its early-stop paragraph for the PR body
            # and continue-plan writes the comment body to post on the PR.
            echo "PR_BODY_EXTRA_PATH=$RUNNER_TEMP/pr-body-extra.md"
            echo "CONTINUE_COMMENT_PATH=$RUNNER_TEMP/continue-comment.md"
            # Where review-report writes the findings comment to post on the PR.
            echo "REVIEW_COMMENT_PATH=$RUNNER_TEMP/review-comment.md"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch: this job holds a write token, so it must
          # never build or run PR code (the default ref on review events).
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/codeaf/go.mod
          cache: false

      - name: Build the harness
        # From the default branch's checkout on this fresh runner, never from
        # a PR or anything the run job produced.
        run: |
          cp -r .github/codeaf "$RUNNER_TEMP/harness"
          (cd "$RUNNER_TEMP/harness" && go build -trimpath -o harness .)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: codeaf-output-${{ github.run_id }}-${{ needs.run.outputs.attempt }}
          path: ${{ runner.temp }}/in

      - name: Check the maintainer's approval
        id: approval
        # Review mode never applies a patch, so nothing needs approving.
        if: needs.run.outputs.touches_harness == 'true' && needs.gate.outputs.mode != 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The environment's protection is set in the repository settings,
          # and GitHub creates a missing environment with no reviewers, so the
          # approval itself is checked: an approved review of this run, for
          # codeaf-harness, by someone with admin or maintain access.
          approvers=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '.[] | select(.state == "approved") | select(any(.environments[]; .name == "codeaf-harness")) | .user.login')
          for u in $approvers; do
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$u/permission" --jq .permission)
            if [ "$perm" = admin ] || [ "$perm" = maintain ]; then
              echo "Approved by $u ($perm)"
              echo "approved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # No maintainer approved. That is not a refusal by itself: a patch
          # whose only .github/ changes are workflow files that pass the
          # deterministic workflow policy is published without one (see
          # "Apply the patch"); anything else is refused there.
          echo "::notice::no maintainer approval; the patch publishes only if its workflow changes pass the workflow policy"
          echo "approved=false" >> "$GITHUB_OUTPUT"

      - name: Apply the patch
        id: apply
        # Review mode: publish never applies or pushes anything.
        if: needs.gate.outputs.mode != 'review'
        env:
          HARNESS_APPROVED: ${{ steps.approval.outputs.approved }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "codeaf[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The default branch's workflows, as checked out above, before any
          # branch is fetched: what the workflow policy compares against.
          rm -rf "$RUNNER_TEMP/wf-default"
          cp -r .github/workflows "$RUNNER_TEMP/wf-default"
          policy_approved=false
          moved=false
          merge_state=none
          if git fetch --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null; then
            git checkout -B "$BRANCH" FETCH_HEAD
            if [ "$MODE" = pr ]; then
              # Issue #57: bring the PR base branch in before the patch is
              # applied. The harness recreates the merge the run job
              # committed (same two parents, tree hash checked) or merges
              # the base tip itself when the run merged nothing. Everything
              # is recomputed here from origin: the merge info the run left
              # is validated data, never executed, and any mismatch refuses
              # the publish.
              "$HARNESS" merge-default publish "$IN/base-commit" "$IN/merge-info.json" "$RUNNER_TEMP/merge-state.env"
              if grep -qx "state=clean" "$RUNNER_TEMP/merge-state.env" 2>/dev/null; then merge_state=clean; fi
              if grep -qx "state=conflicted" "$RUNNER_TEMP/merge-state.env" 2>/dev/null; then merge_state=conflicted; fi
              if grep -qx "state=ff" "$RUNNER_TEMP/merge-state.env" 2>/dev/null; then merge_state=ff; fi
            fi
          else
            # A new branch. If the default branch moved while CodeAF ran, the
            # patch is merged onto it (below) rather than refused as stale.
            # The commit CodeAF started from comes from the run job, so it is
            # untrusted: it is used only if it is a full SHA that the default
            # branch (checked out above) contains.
            base=$(head -c 64 "$IN/base-commit" 2>/dev/null | tr -d '\n' || true)
            if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [ "$base" != "$(git rev-parse HEAD)" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$(git rev-parse HEAD)" --jq .status 2>/dev/null || true)
              # Fetching the base commit gives the 3-way merge its preimages.
              if [ "$status" = ahead ] && git fetch --depth=1 origin "$base" 2>/dev/null; then
                moved=true
              fi
            fi
            git checkout -B "$BRANCH"
          fi
          patch="$IN/changes.patch"
          changed=0
          if [ -f "$patch" ] && [ ! -L "$patch" ] && [ -s "$patch" ]; then
            # Untrusted input: size-capped, must apply to the commit it was made
            # from, may not touch any .git path, and may touch .github/
            # outside .github/codeaf/ only with a maintainer's approval
            # (checked above, in this job). --no-renames, so a file moved out
            # of .github/workflows/ shows up under its old path too.
            if [ "$(stat -c %s "$patch")" -gt 52428800 ]; then
              echo "::error::patch is over 50 MB; refusing it" | tee -a "$PUBLISH_ERRORS_PATH"; exit 1
            fi
            if [ "$moved" = true ]; then
              # Merged onto the current default branch. A branch started from
              # the old base instead would differ from the default branch in
              # any workflow changed since, which GitHub refuses to let
              # GITHUB_TOKEN push. Only if the merge conflicts does the branch
              # start from the base, so the PR shows the conflict.
              echo "The default branch moved while CodeAF ran; merging the patch onto it"
              if ! git apply --index --binary --3way "$patch"; then
                echo "::warning::the patch conflicts with the default branch; starting $BRANCH from $base"
                git reset -q --hard
                git checkout -q -B "$BRANCH" "$base"
                git apply --index --binary "$patch"
              fi
            else
              if [ "$MODE" = pr ]; then
                # Issue #57: the base commit was checked by merge-default
                # above - it is the branch head or the merge commit it
                # recreated from the same two parents. The patch was made
                # before that merge, so a strict apply can fail where a
                # 3-way apply still merges cleanly.
                if ! git apply --index --binary "$patch"; then
                  echo "The patch does not apply strictly on the merged tree; retrying with a 3-way merge"
                  git apply --index --binary --3way "$patch"
                fi
              else
                if [ "$(cat "$IN/base-commit" 2>/dev/null)" != "$(git rev-parse HEAD)" ]; then
                  echo "::error::the branch moved while CodeAF ran; refusing to apply a stale patch" | tee -a "$PUBLISH_ERRORS_PATH"; exit 1
                fi
                git apply --index --binary "$patch"
              fi
            fi
            if git diff --cached --name-only | grep -qE '(^|/)\.git(/|$)'; then
              echo "::error::patch touches a .git path; refusing it" | tee -a "$PUBLISH_ERRORS_PATH"; exit 1
            fi
            # Collected first, not piped to `grep -q`: an early exit there could
            # kill git with SIGPIPE, and under pipefail the test would read false.
            outside=$(git diff --cached --no-renames --name-only | grep '^\.github/' | grep -v '^\.github/codeaf/' || true)
            if [ -n "$outside" ] && [ "$HARNESS_APPROVED" != true ]; then
              printf '%s\n' "$outside" # every line starts with .github/, so none is a workflow command
              # Without a maintainer, only top-level workflow files may change,
              # and only within the deterministic workflow policy
              # (.github/codeaf/workflowpolicy.go): no new triggers,
              # permissions, secrets, secret-bearing step edits, actions or
              # github.event interpolation. The independent review run then
              # checks the PR before anyone merges it.
              other=$(printf '%s\n' "$outside" | grep -vE '^\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$' || true)
              if [ -n "$other" ]; then
                echo "::error::patch touches .github/ outside .github/codeaf/ and top-level workflow files without a maintainer's approval; refusing it" | tee -a "$PUBLISH_ERRORS_PATH"; exit 1
              fi
              before="$RUNNER_TEMP/wf-before"; after="$RUNNER_TEMP/wf-after"
              rm -rf "$before" "$after"; mkdir -p "$before" "$after"
              # mikefarah yq (preinstalled on GitHub's Ubuntu runners) turns
              # each workflow into JSON; any failure refuses the patch.
              for f in "$RUNNER_TEMP"/wf-default/*.yml "$RUNNER_TEMP"/wf-default/*.yaml; do
                [ -f "$f" ] || continue
                yq -o=json '.' "$f" > "$before/$(basename "$f").json"
              done
              while IFS= read -r -d '' f; do
                case "$f" in .github/workflows/*/*) continue ;; esac
                case "$f" in *.yml|*.yaml) ;; *) continue ;; esac
                git show ":$f" | yq -o=json '.' > "$after/$(basename "$f").json"
              done < <(git ls-files -z -- .github/workflows/)
              if "$HARNESS" workflow-policy "$before" "$after" > "$RUNNER_TEMP/workflow-policy.log" 2>&1; then
                cat "$RUNNER_TEMP/workflow-policy.log"
                policy_approved=true
              else
                cat "$RUNNER_TEMP/workflow-policy.log"
                head -c 2000 "$RUNNER_TEMP/workflow-policy.log" | sed 's/^/workflow policy: /' >> "$PUBLISH_ERRORS_PATH"
                echo "::error::the workflow change breaks the workflow policy (above) and no maintainer approved it; refusing it" | tee -a "$PUBLISH_ERRORS_PATH"; exit 1
              fi
            fi
            changed=$(git diff --cached --name-only | wc -l)
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "policy_approved=$policy_approved" >> "$GITHUB_OUTPUT"
          # Issue #57: a conflicted merge must be fully resolved - whatever
          # the patch did, even nothing, publish refuses while a conflict
          # marker remains in any file the merge conflicted.
          if [ "$MODE" = pr ] && [ "$merge_state" = conflicted ]; then
            "$HARNESS" merge-default verify "$RUNNER_TEMP/merge-state.env"
          fi
          if [ "$merge_state" = none ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$changed" -gt 0 ]; then
            git commit -q -m "codeaf: work for #$NUMBER" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          git log --oneline -3

      - name: Push and open/update PR
        id: pr
        # Issue #57: a merge-only push (the branch brought its base in, the
        # patch changed nothing) still moves the branch.
        if: (steps.apply.outputs.changed != '0' || steps.apply.outputs.merged == 'true') && needs.gate.outputs.mode != 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_TOKEN can never push changes to .github/workflows/, so an
          # approved harness patch is pushed as the CodeAF harness GitHub App
          # instead, not as a person. Its id and private key are secrets of the
          # codeaf-harness environment, read only once a maintainer approved
          # or the deterministic workflow policy passed ("Apply the patch").
          # The key only signs a request for an installation token that lasts
          # an hour, limited to this repository and to contents and
          # workflows. The PR is still opened as github-actions[bot].
          APP_ID: ${{ (steps.approval.outputs.approved == 'true' || steps.apply.outputs.policy_approved == 'true') && secrets.CODEAF_APP_ID || '' }}
          APP_KEY: ${{ (steps.approval.outputs.approved == 'true' || steps.apply.outputs.policy_approved == 'true') && secrets.CODEAF_APP_PRIVATE_KEY || '' }}
          APPROVED: ${{ (steps.approval.outputs.approved == 'true' || steps.apply.outputs.policy_approved == 'true') && 'true' || '' }}
          POLICY_APPROVED: ${{ steps.apply.outputs.policy_approved }}
        run: |
          push_token=$GH_TOKEN
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            now=$(date +%s)
            unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64url)"
            # shellcheck disable=SC2016  # pre-existing: '%s' is deliberately single-quoted; directive only, no behavior change
            jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign <(printf '%s\n' "$APP_KEY") | b64url)"
            echo "::add-mask::$jwt"
            # Each call is checked on its own, so a failure stops here with
            # GitHub's answer rather than going on with an empty token.
            api() { curl -sS -o "$RUNNER_TEMP/app-api.json" -w '%{http_code}' -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "$@"; }
            status=$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/installation")
            if [ "$status" != 200 ]; then
              case "$status" in
                404) echo "::error::the CodeAF harness app is not installed on $GITHUB_REPOSITORY (GET /repos/…/installation: 404). Install it on this repository (app settings → Install App)." | tee -a "$PUBLISH_ERRORS_PATH" ;;
                401) echo "::error::GitHub refused the app's JWT (401): check CODEAF_APP_ID and CODEAF_APP_PRIVATE_KEY on the codeaf-harness environment." | tee -a "$PUBLISH_ERRORS_PATH" ;;
                *) echo "::error::looking up the app's installation failed: HTTP $status $(jq -r '.message // empty' "$RUNNER_TEMP/app-api.json")" | tee -a "$PUBLISH_ERRORS_PATH" ;;
              esac
              exit 1
            fi
            installation=$(jq -r '.id // empty' "$RUNNER_TEMP/app-api.json")
            status=$(api -X POST "https://api.github.com/app/installations/$installation/access_tokens" \
              -d "$(jq -n --arg repo "${GITHUB_REPOSITORY#*/}" '{repositories: [$repo], permissions: {contents: "write", workflows: "write"}}')")
            push_token=$(jq -r '.token // empty' "$RUNNER_TEMP/app-api.json")
            rm -f "$RUNNER_TEMP/app-api.json"
            if [ "$status" != 201 ] || [ -z "$push_token" ]; then
              echo "::error::the app could not get an installation token (HTTP $status): it needs Contents and Workflows read and write on $GITHUB_REPOSITORY" | tee -a "$PUBLISH_ERRORS_PATH"
              exit 1
            fi
            echo "::add-mask::$push_token"
            unset APP_KEY jwt
          elif [ "$APPROVED" = true ]; then
            echo "::warning::CODEAF_APP_ID / CODEAF_APP_PRIVATE_KEY are not set on the codeaf-harness environment; pushing with GITHUB_TOKEN, which can't push changes to .github/workflows/"
          fi
          # The #9 case: a push GitHub refuses used to die into "publishing
          # failed" with the cause only in the log. Collect it for the report,
          # redacting anything token-shaped (the URL carries a credential).
          if ! out=$(git push "https://x-access-token:${push_token}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH" 2>&1); then
            printf '%s\n' "$out" | sed -E 's/x-access-token:[^@[:space:]]+@/x-access-token:[redacted]@/g; s/(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})/[redacted]/g' | tail -n 4 | tee -a "$PUBLISH_ERRORS_PATH"
            echo "::error::GitHub refused the push of $BRANCH; the cause is above and in this job's log" | tee -a "$PUBLISH_ERRORS_PATH"
            exit 1
          fi
          # How did the run end? pr-mode reads CodeAF's result (no network, no
          # token) and prints early/ready/stop: an early stop publishes as a
          # draft PR whose body says so, stop: done publishes ready for review.
          "$HARNESS" pr-mode > "$RUNNER_TEMP/pr-mode.env"
          # Its output is derived from the run job's result, so it is parsed,
          # never sourced: only an exact "true" counts, anything else is false.
          early=false; ready=false
          grep -qx 'early=true' "$RUNNER_TEMP/pr-mode.env" && early=true
          grep -qx 'ready=true' "$RUNNER_TEMP/pr-mode.env" && ready=true
          { echo "early=$early"; echo "ready=$ready"; } >> "$GITHUB_OUTPUT"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            title=$(gh issue view "$NUMBER" --json title --jq .title)
            # The body is composed as a file so an early stop can append its
            # paragraph (PR_BODY_EXTRA_PATH, written by pr-mode); without one
            # the body is the one it has always been.
            {
              printf 'Closes #%s\n\n' "$NUMBER"
                # shellcheck disable=SC2016  # the backticks are literal markdown in the PR body; single quotes are correct
              printf 'Opened by the [CodeAF workflow](%s/%s/actions/runs/%s). Comment `/codeaf <instructions>` (or request changes in a review) to have CodeAF continue on this branch.' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              if [ -f "$PR_BODY_EXTRA_PATH" ]; then
                printf '\n\n'
                cat "$PR_BODY_EXTRA_PATH"
              fi
            } > "$RUNNER_TEMP/pr-body.md"
            create_args=(--base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")
            if [ "$early" = true ]; then
              create_args+=(--draft) # the work is unfinished
            fi
            if ! pr_url=$(gh pr create "${create_args[@]}"); then
              echo "::error::could not open the pull request for $BRANCH" | tee -a "$PUBLISH_ERRORS_PATH"
              exit 1
            fi
            pr=${pr_url##*/}
            gh pr edit "$pr" --add-label "$CODEAF_LABEL"
          else
            # This run went onto an existing PR's branch (a /codeaf comment or
            # a continuation): flip the draft marker to how the run ended.
            # Either call can refuse (the PR is already in that state); the
            # push itself is what matters, so keep going.
            if [ "$early" = true ]; then
              gh pr ready --undo "$pr" || true
            elif [ "$ready" = true ]; then
              gh pr ready "$pr" || true
            fi
          fi
          # A workflow change published on the policy alone, with no
          # maintainer: marked so it is merged only after the independent
          # review run passes it (codeaf-review-passed).
          if [ "$POLICY_APPROVED" = true ]; then
            gh label create codeaf-workflow-change --color B60205 --description "Workflow change published on the workflow policy; merge only after the independent review passes" 2>/dev/null || true
            gh pr edit "$pr" --add-label codeaf-workflow-change || echo "::warning::could not label #$pr codeaf-workflow-change"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$BRANCH" || echo "::warning::could not dispatch CI"

      - name: Continue or hand over
        # Between the PR step and Report on purpose: continue-plan counts the
        # PR's earlier CodeAF report comments, and this run's own report is
        # posted next, so it never counts against the continuation cap.
        # Fail-soft: a continuation that cannot start must not fail publishing
        # (the report below still posts).
        if: steps.pr.outputs.number != '' && needs.gate.outputs.mode != 'review'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          "$HARNESS" continue-plan "$PR_NUMBER" > "$RUNNER_TEMP/continue-plan.env"
          # Parsed, never sourced: only the three known actions are acted on.
          action=none
          if grep -qx 'action=continue' "$RUNNER_TEMP/continue-plan.env"; then action="continue"
          elif grep -qx 'action=cap' "$RUNNER_TEMP/continue-plan.env"; then action="cap"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          case "$action" in
            continue)
              # Post the "/codeaf continue: <stop>" comment, then start the run
              # on this PR's branch (the gate's `pr` input). If the dispatch
              # fails, say so: a maintainer can continue it by hand.
              gh pr comment "$PR_NUMBER" --body-file "$CONTINUE_COMMENT_PATH" \
                && gh workflow run codeaf.yml -f pr="$PR_NUMBER" \
                || echo "::warning::could not continue #$PR_NUMBER automatically; a maintainer can continue it by hand with a /codeaf comment on the PR"
              ;;
            cap)
              # The continuation cap is reached: leave the draft to a person.
              gh pr comment "$PR_NUMBER" --body-file "$CONTINUE_COMMENT_PATH" || true
              ;;
          esac

      - name: Independent review
        # Every run that opens or updates the PR is followed by one read-only
        # review run of its diff (the gate's `review` input): the reviewer seat
        # sits on a different model from the worker that wrote the patch.
        # Fail-soft: a review that cannot start must not fail publishing.
        # Only once the work is finished (stop: done): an early stop is
        # continued instead, and reviewing code about to change wastes a run.
        if: steps.pr.outputs.number != '' && steps.pr.outputs.ready == 'true' && needs.gate.outputs.mode != 'review'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh workflow run codeaf.yml -f review="$PR_NUMBER" \
            || echo "::warning::could not start the independent review of #$PR_NUMBER automatically; a maintainer can start it by hand"

      - name: Independent review findings
        # The review run's ending: the findings comment (severity and file:line
        # per finding, with the spend line instead of the run report) is posted
        # on the PR, and its verdict is acted on. Fail-soft: a review that
        # cannot report must not fail publishing.
        if: ${{ !cancelled() && needs.gate.outputs.mode == 'review' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.gate.outputs.number }}
        run: |
          # Kept identical to the harness's review-passed label const.
          label=codeaf-review-passed
          "$HARNESS" review-report "$NUMBER" > "$RUNNER_TEMP/review-plan.env"
          # Parsed, never sourced: only the two known actions are acted on.
          action=report-only
          if grep -qx 'action=fix' "$RUNNER_TEMP/review-plan.env"; then action=fix
          elif grep -qx 'action=label' "$RUNNER_TEMP/review-plan.env"; then action=label
          fi
          gh pr comment "$NUMBER" --body-file "$REVIEW_COMMENT_PATH"
          case "$action" in
            fix)
              # Blocking findings: drop the pass label, then start a fix run on
              # this PR's branch (the gate's `pr` input). If the dispatch
              # fails, say so: a maintainer can start it by hand.
              gh pr edit "$NUMBER" --remove-label "$label" || true
              gh workflow run codeaf.yml -f pr="$NUMBER" \
                || echo "::warning::could not start the fix run for #$NUMBER automatically; a maintainer can start it by hand with a /codeaf comment on the PR"
              ;;
            label)
              # Nothing blocking: make sure the label exists, then add it, so
              # a person (or a merge rule) can merge with confidence.
              gh label create "$label" --color 0e8a16 --description "Independent CodeAF review found no blocking findings" || true
              gh pr edit "$NUMBER" --add-label "$label"
              ;;
          esac

      - name: Report
        # In review mode the findings comment below carries the spend line
        # instead of the run report.
        if: always() && needs.gate.outputs.mode != 'review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          WEEK_SPENT_BEFORE: ${{ needs.run.outputs.week_before }}
          CHANGED: ${{ steps.apply.outputs.changed }}
          OUTCOME: ${{ needs.run.result != 'success' && 'run job failed' || (job.status != 'success' && 'publishing failed' || ((steps.apply.outputs.changed != '0' || steps.apply.outputs.merged == 'true') && 'changes pushed' || 'no changes')) }}
        run: |
          "$HARNESS" report > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          target="${{ steps.pr.outputs.number }}"
          [ -n "$target" ] || target="$NUMBER"
          gh issue comment "$target" --body-file "$RUNNER_TEMP/report.md"
          if [ "$target" != "$NUMBER" ] && [ "$MODE" = issue ]; then
            gh issue comment "$NUMBER" --body "CodeAF opened #$target for this issue."
          fi

  queue-next:
    # Starts the queue (codeaf-queue.yml) once this run is over, so the next
    # queued issue begins without waiting for a schedule. A run the queue
    # started was dispatched with GITHUB_TOKEN, and such runs fire no
    # workflow_run event, so the queue would never see it finish. This run is
    # still in progress while this job runs, so it names itself and the
    # queue leaves it out.
    needs: [gate, publish]
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run codeaf-queue.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f finished_run="$GITHUB_RUN_ID" \
            || echo "::warning::could not start the queue; it will run on its schedule"
